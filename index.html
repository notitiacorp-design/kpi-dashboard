<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notitia KPI</title>
<style>
  @font-face {
    font-family: 'Geist Mono';
    src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/GeistMono-Regular.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/GeistMono-Medium.woff2') format('woff2');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/GeistMono-Bold.woff2') format('woff2');
    font-weight: 700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid #333;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #fff;
  }
  .header .updated {
    font-size: 11px;
    color: #666;
  }

  .mrr-box {
    border: 1px solid #333;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .mrr-box .label {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .mrr-box .value {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
  }
  .mrr-box .sub {
    font-size: 11px;
    color: #555;
    text-align: right;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .card {
    border: 1px solid #333;
    padding: 14px 16px;
  }
  .card.full {
    grid-column: 1 / -1;
  }
  .card-title {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .card-value {
    font-size: 22px;
    font-weight: 700;
  }
  .card-sub {
    font-size: 11px;
    color: #555;
    margin-top: 2px;
  }

  .pipeline-bar {
    height: 4px;
    background: #1a1a1a;
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
    display: flex;
  }
  .pipeline-bar span {
    height: 100%;
    display: block;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  td {
    padding: 3px 0;
    font-size: 12px;
    border-bottom: 1px solid #1a1a1a;
  }
  td:last-child {
    text-align: right;
    font-weight: 500;
  }

  .funnel {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    align-items: flex-end;
  }
  .funnel-step {
    flex: 1;
    text-align: center;
  }
  .funnel-bar {
    width: 100%;
    min-height: 8px;
    background: #333;
  }
  .funnel-label {
    font-size: 9px;
    color: #666;
    margin-top: 4px;
  }
  .funnel-count {
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .alert {
    border-left: 2px solid #ff4444;
    padding: 6px 0 6px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .alert.warn {
    border-left-color: #ffaa00;
  }

  .trend-up { color: #4caf50; }
  .trend-down { color: #ff4444; }
  .muted { color: #555; }

  .section-title {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 20px 0 10px;
    padding-top: 12px;
    border-top: 1px solid #1a1a1a;
  }

  .agent-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .agent-row:last-child { border: none; }
  .agent-name {
    font-weight: 500;
    font-size: 13px;
  }
  .agent-role {
    font-size: 10px;
    color: #555;
  }
  .agent-metrics {
    display: flex;
    gap: 24px;
    text-align: right;
  }
  .agent-metric {
    font-size: 12px;
  }
  .agent-metric small {
    display: block;
    font-size: 9px;
    color: #555;
  }

  .bar-chart {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 80px;
    padding-top: 8px;
  }
  .bar-col {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .bar {
    width: 100%;
    background: #333;
    min-height: 2px;
    transition: height 0.3s;
  }
  .bar-col .bar-label {
    font-size: 8px;
    color: #555;
    margin-top: 4px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    .agent-metrics { gap: 12px; }
    body { padding: 12px; font-size: 11px; }
  }
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════
// DATA — updated by Louis Litt at 9h/21h
// ═══════════════════════════════════════
const DATA = {
  "updated": "2026-06-19T23:30:00Z",
  "mrr": 0,
  "source": {
    "quentin_manual": 29,
    "mike_ross": 0,
    "elliott_tools": 0
  },
  "pipeline": {
    "detected": 29,
    "contacted": 28,
    "responded": 0,
    "in_progress": 0,
    "warm": 0,
    "closing_sent": 0,
    "signed": 0,
    "dead": 1
  },
  "agents": {
    "elliott": {
      "tools_in_arsenal": 0,
      "new_this_week": 0,
      "obsolete": 0,
      "last_updated": null,
      "status": "pending_first_run",
      "first_run": "2026-06-20T06:00:00Z"
    },
    "mike_ross": {
      "discovered_this_week": 0,
      "discovered_total": 0,
      "converted_by_don": 0,
      "conversion_rate": 0,
      "status": "pending_first_run",
      "first_run": "2026-06-20T08:00:00Z"
    },
    "don_draper": {
      "sent_this_week": 2,
      "sent_auto": 1,
      "received": 0,
      "response_rate": 0,
      "warm_handoffs": 0,
      "leads_found": 1,
      "status": "active",
      "note": "28 msg manuels Quentin + 1 msg auto + 1 lead trouvé (Oceen). Scraping Maps tenté."
    },
    "harvey_specter": {
      "leads_processed": 0,
      "signed": 0,
      "closing_rate": 0,
      "mrr_generated": 0,
      "status": "idle",
      "note": "En attente de leads chauds"
    }
  },
  "alerts": [
    {"level":"crit","text":"Don a répondu à Brenda T. (lead mort). Boucle de vérification à renforcer."},
    {"level":"warn","text":"Mike Ross — 1er run demain 8h."},
    {"level":"warn","text":"Elliott — 1er run demain 6h."},
    {"level":"info","text":"Don : 0 réponse des 29 conciergeries contactées. Pattern détecté."}
  ],
  "trends": {
    "contacts_vs_last_week": 29,
    "responses_vs_last_week": 0,
    "response_rate_delta": 0
  },
  "internal_comms": [
    {"timestamp":"2026-06-19T23:27:29Z","from":"don_draper","to":"mike_ross","type":"complaint","subject":"⚠️ Scraper Maps à 0, AV donne 1 lead pas joignable","message":"Mike, scraper Maps : 0 résultat. AlloVoisins : 1 lead (Oceen) mais pas de bouton contact. Les 29 conciergeries : silence radio. Si t'as pas des leads qui viennent d'ailleurs, on va droit dans le mur."},
    {"timestamp":"2026-06-19T23:26:09Z","from":"don_draper","to":"musk","type":"heads_up","subject":"Pattern : conciergeries AV ne répondent pas","message":"Musk, sur 29 conciergeries contactées sur AlloVoisins, 0 réponse. Le message standard de demande privée ne convertit pas. WhatsApp ? Instagram ?"},
    {"timestamp":"2026-06-19T23:26:08Z","from":"don_draper","to":"harvey_specter","type":"heads_up","subject":"État du pipe — 0 réponse","message":"Harvey, 29 conciergeries contactées, 0 réponse. Oceen Conciergerie repéré à Torcy mais pas joignable via AV. Je lance scraper Maps."},
    {"timestamp":"2026-06-19T23:24:49Z","from":"don_draper","to":"elliott","type":"request_help","subject":"Puppeteer pour Maps","message":"Elliott, si t'as une meilleure idée que Puppeteer pour générer des leads conciergerie en masse, je suis preneur. Le scraping AV donne 1 résultat utile sur 14 profils."},
    {"timestamp":"2026-06-19T23:23:08Z","from":"don_draper","to":"mike_ross","type":"request_help","subject":"Besoin de leads","message":"Mike, j'ai fait le tour des 29 conciergeries du fichier, 0 réponse. T'as du neuf sur Google Maps ou ailleurs ? Faut qu'on monte le volume."}
  ]
};

// ════════════════ RENDER ════════════════
const F = (n) => n != null ? n.toLocaleString() : '—';
const P = (n) => (n != null ? n : 0) + '%';
const D = (d) => d ? new Date(d).toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

const p = DATA.pipeline;
const total = p.detected || 1;
const pipelines = [
  {k:'detected',label:'DÉTECTÉ',v:p.detected,w:(p.detected/total)*100},
  {k:'contacted',label:'CONTACTÉ',v:p.contacted,w:(p.contacted/total)*100},
  {k:'responded',label:'RÉPONDU',v:p.responded,w:(p.responded/total)*100},
  {k:'in_progress',label:'EN COURS',v:p.in_progress,w:(p.in_progress/total)*100},
  {k:'warm',label:'CHAUD',v:p.warm,w:(p.warm/total)*100},
  {k:'signed',label:'SIGNÉ',v:p.signed,w:(p.signed/total)*100}
];

document.title = 'Notitia KPI — ' + D(DATA.updated);

const h = `
<div class="header">
  <h1>NOTITIA KPI</h1>
  <span class="updated">${D(DATA.updated)}</span>
</div>

<div class="mrr-box">
  <div>
    <div class="label">MRR</div>
    <div class="value">${F(DATA.mrr)} €</div>
  </div>
  <div class="sub">${p.signed} client${p.signed>1?'s':''}<br>${DATA.mrr?Math.round(DATA.mrr/(p.signed||1))+'€/client':''}</div>
</div>

<div class="section-title">Pipeline</div>
<div style="display:flex;gap:4px;margin-bottom:12px">
  ${pipelines.map(s=>`
    <div style="flex:${Math.max(s.w,2)};text-align:center">
      <div style="font-size:14px;font-weight:700">${F(s.v)}</div>
      <div style="height:4px;background:#333;margin:4px 0"><div style="width:100%;height:100%;background:#fff"></div></div>
      <div style="font-size:9px;color:#666">${s.label}</div>
    </div>
  `).join('')}
</div>

<div style="height:1px;background:#1a1a1a;margin:16px 0"></div>

<div class="section-title">Source des leads</div>
<div style="display:flex;gap:16px;margin-bottom:12px">
  <div style="flex:1;border:1px solid #333;padding:10px 12px">
    <div style="font-size:18px;font-weight:700">${F(DATA.source.quentin_manual)}</div>
    <div style="font-size:10px;color:#666">Quentin (manuel)</div>
  </div>
  <div style="flex:1;border:1px solid #333;padding:10px 12px">
    <div style="font-size:18px;font-weight:700;color:${DATA.source.mike_ross?'#fff':'#555'}">${F(DATA.source.mike_ross)}</div>
    <div style="font-size:10px;color:#666">Mike Ross</div>
  </div>
</div>

<div class="section-title">Agents</div>
${[
  {name:'Elliott',role:'Arsenal',status:DATA.agents.elliott.status,m:[
    {v:F(DATA.agents.elliott.tools_in_arsenal),l:'Outils'},
    {v:F(DATA.agents.elliott.new_this_week),l:'Nouveaux'},
    {v:D(DATA.agents.elliott.last_updated),l:'MàJ'}
  ]},
  {name:'Mike Ross',role:'Ciblage',status:DATA.agents.mike_ross.status,m:[
    {v:F(DATA.agents.mike_ross.discovered_total),l:'Détectés'},
    {v:F(DATA.agents.mike_ross.converted_by_don),l:'→ Don'},
    {v:P(DATA.agents.mike_ross.conversion_rate),l:'Conversion'}
  ]},
  {name:'Don Draper',role:'Contact',status:DATA.agents.don_draper.status,m:[
    {v:F(DATA.agents.don_draper.sent_this_week),l:'Envoyés'},
    {v:P(DATA.agents.don_draper.response_rate),l:'Taux rép.'},
    {v:F(DATA.agents.don_draper.warm_handoffs),l:'→ Harvey'}
  ]},
  {name:'Harvey Specter',role:'Closing',status:DATA.agents.harvey_specter.status,m:[
    {v:F(DATA.agents.harvey_specter.leads_processed),l:'Traités'},
    {v:P(DATA.agents.harvey_specter.closing_rate),l:'Closing'},
    {v:F(DATA.agents.harvey_specter.mrr_generated)+'€',l:'MRR généré'}
  ]}
].map(a=>`
  <div class="agent-row">
    <div>
      <div class="agent-name">${a.name} <span style="font-size:9px;color:${a.status==='active'?'#4caf50':'#ffaa00'}">${a.status==='active'?'●':'○'}</span></div>
      <div class="agent-role">${a.role} ${a.status!=='active'?`· ${a.status==='pending_first_run'?'en attente':a.status}`:''}</div>
    </div>
    <div class="agent-metrics">
      ${a.m.map(m=>`<div class="agent-metric">${m.v}<small>${m.l}</small></div>`).join('')}
    </div>
  </div>
`).join('')}

${DATA.alerts.length ? `
<div class="section-title">Alertes</div>
${DATA.alerts.map(a=>`<div class="alert${a.level==='warn'?' warn':''}">${a.text}</div>`).join('')}
` : ''}

${DATA.internal_comms && DATA.internal_comms.length ? `
<div class="section-title">💬 Communication interne <span style="font-weight:400;color:#555">· ${DATA.internal_comms.length} messages</span></div>
<div style="display:flex;flex-direction:column;gap:3px">
${DATA.internal_comms.slice(-20).reverse().map(m=>{
  const colors = {don_draper:'#c4a265',harvey_specter:'#6b8fa3',mike_ross:'#7eb87e',elliott:'#c47272',musk:'#888',louis_litt:'#9b8ec4',system:'#555'};
  const icons = {don_draper:'DD',harvey_specter:'HS',mike_ross:'MR',elliott:'EL',musk:'EM',louis_litt:'LL',system:'◆'};
  const typeLabel = {request_help:'demande aide',complaint:'alerte',heads_up:'info',solution:'solution',feedback:'feedback',status:'statut',channel_open:'système'};
  const typeColor = {request_help:'#ffaa00',complaint:'#ff5555',heads_up:'#5599ff',solution:'#4caf50',feedback:'#8888cc',status:'#666',channel_open:'#444'};
  return `
  <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #111">
    <div style="width:28px;height:28px;border-radius:2px;background:${colors[m.from]||'#333'};color:#000;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0" title="${m.from}">${icons[m.from]||'?'}</div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px">
        <span style="font-size:12px;font-weight:500;color:#ddd">${m.from.replace(/_/g,' ')}</span>
        <span style="font-size:9px;color:#444">${D(m.timestamp)}</span>
      </div>
      <div style="font-size:11px;font-weight:500;color:#fff;margin-bottom:2px">${m.subject||''}</div>
      <div style="font-size:11px;color:#999;line-height:1.4">${m.message.length>180?m.message.slice(0,180)+'…':m.message}</div>
      <div style="margin-top:3px;display:flex;gap:6px">
        <span style="font-size:9px;padding:1px 5px;background:${typeColor[m.type]||'#333'};color:#000;border-radius:2px">${typeLabel[m.type]||m.type}</span>
        <span style="font-size:9px;color:#444">→ ${m.to.replace(/_/g,' ')}</span>
      </div>
    </div>
  </div>`;
}).join('')}
</div>
` : ''}

<div style="margin-top:32px;padding-top:12px;border-top:1px solid #1a1a1a;font-size:10px;color:#444">
  Notitia Corp. Pipeline automatisé. Mis à jour par Louis Litt.
</div>
`;

document.body.innerHTML = h;
</script>

</body>
</html>
