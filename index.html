    margin-top: 8px;
    align-items: flex-end;
  }
  .funnel-step {
    flex: 1;
    text-align: center;
  }

    background: #333;
  }
  .funnel-label {
    font-size: 9px;
    color: #666;
    margin-top: 4px;
  }
  .funnel-count {
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 4px;
  }

    padding: 6px 0 6px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .alert.warn {
    border-left-color: #ffaa00;
  }

  .trend-down { color: #ff4444; }
  .muted { color: #555; }

    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 20px 0 10px;
    padding-top: 12px;

    font-size: 13px;

  .agent-role {

    color: #555;

  .agent-metric small {

    color: #555;
